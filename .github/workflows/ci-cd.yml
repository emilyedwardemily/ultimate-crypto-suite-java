name: UC-Suite CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PYTHON: ghcr.io/${{ github.repository }}/python-backend
  IMAGE_NODE: ghcr.io/${{ github.repository }}/node-gateway
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web-frontend

jobs:
  # ── STAGE 1: SECURITY SCAN ──────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TruffleHog Secret Detection
        uses: trufflesecurity/trufflehog@v3
        with:
          extra_args: --only-verified

  # ── STAGE 2: BUILD & TEST ───────────────────────────────
  build-python:
    name: Build Python Backend
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd /home/emily/UC-BACKED
          pip install -r requirements.txt
      - name: Syntax check
        run: python3 -c "import ast; ast.parse(open('/home/emily/UC-BACKED/main.py').read())"
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_PYTHON }}:${{ github.sha }} \
            -f /home/emily/UC-BACKED/Dockerfile /home/emily/UC-BACKED
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.IMAGE_PYTHON }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_PYTHON }}:${{ github.sha }} ${{ env.IMAGE_PYTHON }}:latest
          docker push ${{ env.IMAGE_PYTHON }}:latest

  build-node:
    name: Build Node.js Gateway
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: |
          cd /home/emily/Desktop/UltimateCryptoSuite/src/server
          npm ci
      - name: Syntax check
        run: node --check /home/emily/Desktop/UltimateCryptoSuite/src/server/index.js
      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NODE }}:${{ github.sha }} \
            -f /home/emily/Desktop/UltimateCryptoSuite/src/server/Dockerfile \
            /home/emily/Desktop/UltimateCryptoSuite/src/server
      - name: Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.IMAGE_NODE }}:${{ github.sha }}
          docker tag ${{ env.IMAGE_NODE }}:${{ github.sha }} ${{ env.IMAGE_NODE }}:latest
          docker push ${{ env.IMAGE_NODE }}:latest

  build-web:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    needs: [secret-scan]
    defaults:
      run:
        working-directory: /home/emily/Desktop/UltimateCryptoSuite/web
    env:
      NEXT_PUBLIC_PYTHON_URL: https://ultimate-crypto-python.onrender.com
      NEXT_PUBLIC_NODE_URL: https://ultimate-crypto-node-gateway.onrender.com
      NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  # ── STAGE 3: DEPLOY TO RENDER ───────────────────────────
  deploy:
    name: Deploy to Render
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-python, build-node, build-web]
    steps:
      - name: Trigger Python backend deploy
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_PYTHON_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
      - name: Trigger Node.js gateway deploy
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_NODE_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
