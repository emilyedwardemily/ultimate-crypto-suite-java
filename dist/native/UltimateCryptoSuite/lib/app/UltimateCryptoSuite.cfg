[Application]
app.classpath=$APPDIR/UltimateCryptoSuite.jar
app.mainclass=app.Launcher

[JavaOptions]
java-options=-Djpackage.app-version=1.0.0
java-options=--enable-native-access=javafx.graphics
java-options=--add-exports=javafx.graphics/com.sun.glass.ui=ALL-UNNAMED
java-options=-Xms128m
java-options=-Xmx1g
